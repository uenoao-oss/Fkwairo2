 CAP={b:okCap(tb.cap),r:okCap(tr.cap)};
 for(const t of['b','r']){const el=document.querySelector('.tm.'+t);el.style.background=`linear-gradient(${TEAM[t].col},${shade(TEAM[t].col,.55)})`;el.style.color=lum(TEAM[t].col)>.6?'#14161c':'#fff';}
 $('nb').textContent=TEAM.b.name+(ME==='b'&&!G.spec?'（あなた）':'');$('nr').textContent=TEAM.r.name+(ME==='r'?'（あなた）':'');recolorCrowd();}
function clientStart(m){NET.started=true;NET.mid=m.mid;NET.teams=m.teams;aInit();setMode('game');FANS.body.visible=FANS.head.visible=false;$('lobby').classList.remove('on');L.inLobby=false;closeChal();
 G={phase:'title',pt:0,kick:m.first,score:{b:0,r:0},hist:{b:[],r:[]},money:{b:300,r:300}};setupTeamsOnline(m.teams);G.first=m.first;hud();
 if(!G.spec&&L.conn)lobbySt('play',NET.host?L.peer.id:NET.hostId);T=null;startToss(m.first);}
function hostHandle(m,from){const relay=()=>{for(const c of [NET.c,...NET.specs])if(c&&c!==from&&c.open)c.send(m);};
 switch(m.t){
  case 'ping':return;
  case 'turn':NET.picks={};NET.shotD=null;NET.gr=false;NET.snap={};relay();return;
  case 'pick':NET.picks[m.s==='r'?'r':'b']=String(m.id||'');if('b' in NET.picks&&'r' in NET.picks){const r={t:'reveal',b:NET.picks.b,r:NET.picks.r};NET.picks={};NET.raw(r);clientHandle(r);}return;
  case 'wall':relay();if(from)clientHandle(m);return;
  case 'shot':NET.shotD={q:m.q,feint:!!m.feint};{const r={t:'rdy',k:1};NET.raw(r);clientHandle(r);}tryGo();return;
  case 'gready':NET.gr=true;{const r={t:'rdy',g:1};NET.raw(r);clientHandle(r);}tryGo();return;
  case 'snap':relay();if(from)clientHandle(m);return;}}
function tryGo(){if(!NET.shotD||!NET.gr||!T)return;const q=NET.shotD.q,f=NET.shotD.feint,sh=whoKicks(q[0].cx,q[0].cy),dm=f?(sh===3?1:sh===1?(Math.random()<.5?0:2):2-sh):-1;
 const m={t:'go',q,feint:f,dummy:dm,wo:T.wallOff,x0:T.keepers[0].x0};NET.shotD=null;NET.gr=false;NET.raw(m);clientHandle(m);}
function clientHandle(m){if(!NET)return;
 switch(m.t){
  case 'start':clientStart(m);return;
  case 'spec0':G={phase:'title',pt:0,kick:'b',score:m.score||{b:0,r:0},hist:m.hist||{b:[],r:[]},money:m.money||{b:200,r:200}};NET.started=true;setupTeamsOnline(m.teams);hud();$('lobby').classList.remove('on');L.inLobby=false;aInit();setMode('game');G.waitTurn=true;banner('観戦中','次のキックから映ります','#fff',2500);return;
  case 'turn':if(G.phase==='toss'||!G.waitTurn)NET.pend=m.p;else newTurn(m.p);return;
  case 'reveal':if(!T)return;NET.choices={b:m.b,r:m.r};$('ban').classList.remove('on');G.phase='bribe';reveal(null);return;
  case 'wall':if(T&&(T.dt!==ME||G.spec)&&['wall','waitK','waitG','aim','contact','gauge','specwait','wait','runup'].includes(G.phase)){T.wallOff=+m.o||0;T.keepers[0].x0=clamp(+m.x||0,-6,6);}return;
  case 'rdy':if(T){if(m.k)T.kReady=true;if(m.g)T.gReady=true;}return;
  case 'go':if(!T)return;T.q=m.q;T.feint=!!m.feint;T.forceDummy=m.dummy;T.wallOff=m.wo;if(T.dt!==ME||G.spec)T.keepers[0].x0=m.x0;T.bi=0;T.kReady=T.gReady=true;$('ban').classList.remove('on');startRunup(true);return;
  case 'snap':if(NET.auth()&&!G.spec)return;NET.snap[m.bi]=m;return;
  case 'resume':{for(const id of['bribe','cut','ban','chal','netmsg'])$(id).classList.remove('on');$('cut').className='';awayUI(null);NET.away=false;NET.last=Date.now();
   if(!NET.started||G.phase==='title'){G={phase:'title',pt:0,kick:m.first,score:{b:0,r:0},hist:{b:[],r:[]},money:{b:300,r:300}};NET.mid=m.mid;NET.teams=m.teams;setupTeamsOnline(m.teams);G.first=m.first;NET.started=true;$('lobby').classList.remove('on');$('title').classList.remove('on');L.inLobby=false;aInit();setMode('game');}
   if(m.p){G.waitTurn=true;newTurn(m.p);}else G.waitTurn=true;banner('再開！','このキックの最初から','#ffd54a',1300);}return;
  case 'full':lobbyMsg('観戦枠がいっぱいです');NET=null;return;}}
function hostResume(){awayUI(null);NET.away=false;const m={t:'resume',teams:NET.teams,first:G.first,p:NET.curTurn,mid:NET.mid};NET.raw(m);
 for(const id of['bribe','cut','ban'])$(id).classList.remove('on');$('cut').className='';
 if(NET.curTurn){NET.picks={};NET.shotD=null;NET.gr=false;NET.snap={};newTurn(NET.curTurn,true);banner('再開！','このキックの最初から','#ffd54a',1300);}}
function awayUI(sec){const el=$('away');if(sec==null){el.classList.remove('on');return;}el.classList.add('on');$('awayt').textContent=`${G.spec?'試合の接続を待っています':'相手が離れています'}…（残り${sec}秒）`;}
function netLost(){if(!NET||NET.ended||G.win)return;clearMatch();awayUI(null);NET.ended=true;const spec=G.spec;$('netmsgt').textContent=spec?'試合が終了しました':'相手が切断しました';$('netmsg').classList.add('on');}
function netEnd(){clearMatch();awayUI(null);const n=NET;NET=null;if(n){n.ended=true;for(const c of [n.c,...n.specs])if(c){try{c.close();}catch(e){}}}
 $('end').classList.remove('on');$('netmsg').classList.remove('on');$('toss').classList.remove('on');FANS.body.visible=FANS.head.visible=false;for(const f of FW)S.remove(f.p);FW=[];PARTS=[];T=null;G={phase:'title',pt:0,kick:'b',score:{b:0,r:0},hist:{b:[],r:[]},money:{b:300,r:300}};hud();setMode('home');
 for(const id of['thru','eye','back','mvL','mvR','joy','dive','timer','ready','swipe','bribe','cut','ban'])$(id).classList.remove('on');go('title');$('title').classList.remove('on');
 if(L.conn)lobbySt('idle');enterLobby();}
$('netback').addEventListener('click',netEnd);
$('online').addEventListener('click',()=>{aInit();setMode('home');enterLobby();});

/* 読み込み直したあとの復帰 */
async function rejoinSaved(sv){aInit();setMode('game');$('title').classList.remove('on');$('rejoin').classList.remove('on');
 if(typeof Peer==='undefined')return;
 try{if(sv.role==='host'){let p=null;for(let i=0;i<10&&!p;i++){try{p=await newPeer(sv.myId);}catch(e){await sleep(1500);}}if(!p)throw new Error('id');L.peer=p;}else{L.peer=await newPeer();}}
 catch(e){clearMatch();goHome();return;}
 L.peer.on('connection',onMatchConn);L.peer.on('error',()=>{});L.peer.on('disconnected',()=>{try{L.peer.reconnect();}catch(e){}});
 NET=makeNet(sv.role);NET.mid=sv.mid;NET.teams=sv.teams;NET.curTurn=sv.p;NET.hostId=sv.hostId;NET.started=sv.role==='host';NET.last=Date.now()-4100;
 G={phase:'title',pt:0,kick:sv.first,score:{b:0,r:0},hist:{b:[],r:[]},money:{b:300,r:300}};setupTeamsOnline(sv.teams);G.first=sv.first;if(sv.p&&sv.p.st){G.score=sv.p.st.score;G.hist=sv.p.st.hist;G.money=sv.p.st.money;}hud();go('netwait');}
{const sv=loadMatch();if(sv){$('rejoin').classList.add('on');$('rejoin').onclick=()=>rejoinSaved(sv);}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(L.peer&&L.peer.disconnected){try{L.peer.reconnect();}catch(e){}}if(NET&&!NET.host)NET.rjT=0;if(L.inLobby&&!L.conn)joinLobby();});

hud();requestAnimationFrame(loop);
}
